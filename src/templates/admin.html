<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCards 管理后台</title>
    <link rel="stylesheet" href="./admin.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><span class="logo">⚙️</span> vCards 管理后台</h1>
            <div class="header-actions">
                <button id="add-btn" class="btn btn-primary">新增联系人</button>
                <button id="refresh-btn" class="btn btn-secondary">刷新列表</button>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="搜索企业名称..." />
            <select id="category-filter">
                <option value="all">全部分类</option>
            </select>
        </div>

        <main class="main-content">
            <div id="card-grid" class="card-grid">
                <!-- 卡片将动态生成 -->
            </div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        </main>

        <!-- 编辑弹窗 -->
        <div id="modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">新增联系人</h3>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <input type="hidden" id="form-id">
                        <input type="hidden" id="form-original-category">
                        <input type="hidden" id="form-original-filename">
                        <div class="form-group">
                            <label>分类</label>
                            <select id="form-category" required>
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>企业名称</label>
                            <input type="text" id="form-organization" required placeholder="企业名称">
                        </div>
                        <div class="form-group">
                            <label>电话号码</label>
                            <div id="phone-list">
                                <div class="phone-item">
                                    <input type="text" class="phone-input" placeholder="电话号码">
                                    <input type="text" class="phone-label-input" placeholder="标签（可选）">
                                    <button type="button" class="remove-phone-btn">×</button>
                                </div>
                            </div>
                            <button type="button" id="add-phone-btn" class="btn btn-small">+ 添加号码</button>
                        </div>
                        <div class="form-group">
                            <label>官网地址</label>
                            <input type="url" id="form-url" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>工作邮箱</label>
                            <div id="email-list">
                                <div class="email-item">
                                    <input type="email" class="email-input" placeholder="工作邮箱">
                                    <button type="button" class="remove-email-btn">×</button>
                                </div>
                            </div>
                            <button type="button" id="add-email-btn" class="btn btn-small">+ 添加邮箱</button>
                        </div>
                        <div class="form-group">
                            <label>企业图标</label>
                            <input type="file" id="form-icon" accept="image/png">
                            <p class="hint">支持 PNG 格式，建议尺寸 200×200px</p>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button id="save-btn" class="btn btn-primary">保存</button>
                    <button id="cancel-btn" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./admin.js"></script>
</body>
</html>
